<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consultorio VITAE - Pacientes</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: white; margin: 20px; }
        header { background-color: #067F8F; color: white; padding: 30px; text-align: center; }
        nav { background-color: #333333; padding: 10px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; cursor: pointer; }
        footer { background-color: skyblue; padding: 15px; text-align: center; margin-top: 30px; }

        .form-container { max-width: 500px; margin: 40px auto 20px auto; padding: 20px; border: 1px solid #067F8F; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; font-size: 14px; }
        input[type="text"], input[type="number"], input[type="date"], input[type="email"], input[type="tel"] { width: 100%; padding: 10px; border: 1px solid #ddd; font-family: Arial, sans-serif; font-size: 14px; box-sizing: border-box; }
        input:focus { outline: 1px solid #067F8F; }
        .btn-submit { background-color: #067F8F; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; font-family: Arial, sans-serif; }
        .btn-submit:hover { background-color: #045b67; }
        .form-title { color: #067F8F; margin-top: 0; margin-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>VITAE</h1>
        <p><strong>Consultorio médico</strong></p>
    </header>

    <hr> 
    <nav>
        <a href="index.html">Inicio</a>
        <a href="pacientesformulario.html">Pacientes</a>
        <a href="consultasformulario.html">Consultas</a>
        <a href="personalformulario.html">Personal Clínico</a>
    </nav>

    <main>
        <div style="max-width: 500px; margin: 30px auto 0 auto; display: flex; gap: 10px;">
            <button id="btnModoRegistrar" onclick="cambiarModo('registrar')" style="flex: 1; padding: 12px; background-color: #067F8F; color: white; border: none; font-weight: bold; cursor: pointer; font-family: Arial;">[+] Registrar Nuevo</button>
            <button id="btnModoBuscar" onclick="cambiarModo('buscar')" style="flex: 1; padding: 12px; background-color: #f4f4f4; color: #333; border: 1px solid #ddd; font-weight: bold; cursor: pointer; font-family: Arial;">[🔍] Buscar Paciente</button>
        </div>

        <div id="seccionRegistrar" class="form-container" style="margin-top: 10px; display: block;">
            <h2 class="form-title">Registrar Pacientes</h2>
            <form>
                <div class="form-group">
                    <label>ID del Paciente:</label>
                    <input type="text" id="id_paciente" name="id_paciente" placeholder="Ej: P-011" required>
                </div>
                
                <div class="form-group">
                    <label>Nombre Completo:</label>
                    <input type="text" id="nombre_completo" name="nombre_completo" placeholder="Ej: Juan Pérez" required>
                </div>
                
                <div class="form-group">
                    <label>Fecha de Nacimiento:</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                </div>
                
                <div class="form-group">
                    <label>Dirección:</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Ej: Calle Azul, #2376" required>
                </div>
                
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="correo_electronico" name="correo_electronico" placeholder="Ej: usuario@correo.com" required>
                </div>

                <div class="form-group">
                    <label>Género:</label>
                    <input type="text" id="genero" name="genero" placeholder="Ej: Masculino / Femenino" required>
                </div>
            
                <div class="form-group">
                    <label>Teléfono Personal:</label>
                    <input type="tel" id="telefono_personal" name="telefono_personal" placeholder="Ej: 5555555555" required>
                </div>

                <div class="form-group">
                    <label>Teléfono de Emergencia:</label>
                    <input type="tel" id="telefono_emergencia" name="telefono_emergencia" placeholder="Ej: 5555555555" required>
                </div>

                <div class="form-group">
                    <label>RFC:</label>
                    <input type="text" id="rfc" name="rfc" placeholder="Ej: ABCD900101XXX" required>
                </div>

                <div class="form-group">
                    <label>Seguro:</label>
                    <input type="text" id="seguro" name="seguro" placeholder="Ej: IMSS / Privado / No" required>
                </div>

                <button type="button" class="btn-submit" onclick="agregarPacientes()">Guardar Paciente</button>
            </form>
        </div>

        <div id="seccionBuscar" class="form-container" style="margin-top: 10px; display: none;">
            <h2 class="form-title" style="color: #333;">Consultar Paciente</h2>
            <div class="form-group" style="display: flex; gap: 10px;">
                <input type="text" id="id_buscar" placeholder="Escribe el ID del paciente a buscar...">
                <button type="button" class="btn-submit" style="width: auto; padding: 0 25px; background-color: #333;" onclick="buscarPacientePorId()">Buscar</button>
            </div>

            <table border="1" style="width: 100%; border-collapse: collapse; text-align: left; font-family: Arial; margin-top: 20px; display: none;" id="tablaResultado">
                <thead style="background-color: #067F8F; color: white;">
                    <tr>
                        <th style="padding: 10px;">Campo</th>
                        <th style="padding: 10px;">Dato del Paciente</th>
                    </tr>
                </thead>
                <tbody id="cuerpoResultado">
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p><strong>Nombre completo:</strong> Yessenia Leos</p>
        <p><strong>No. de control:</strong> 24308051280576</p>
        <p><strong>Semestre y Grupo:</strong> 4-I</p>
        <p><strong>Especialidad:</strong> Programación</p>
    </footer>

    <script>
        // Esta línea detecta dinámicamente si estás en el puerto de Live Server (5500) o local,
        // y redirige las peticiones de forma forzada al puerto del backend (5000) de Project IDX.
        const backendURL = "https://5000-proyectoformulario-15022138.cloudworkstations.dev";

        // === FUNCIÓN PARA GUARDAR ===
        async function agregarPacientes(){
            let idPaciente = document.getElementById("id_paciente").value;
            let nombreCompleto = document.getElementById("nombre_completo").value;
            let fechaNacimiento = document.getElementById("fecha_nacimiento").value;
            let direccion = document.getElementById("direccion").value;
            let correoElectronico = document.getElementById("correo_electronico").value;
            let genero = document.getElementById("genero").value;
            let telefonoPersonal = document.getElementById("telefono_personal").value;
            let telefonoEmergencia = document.getElementById("telefono_emergencia").value;
            let rfc = document.getElementById("rfc").value;
            let seguro = document.getElementById("seguro").value;

            if(
                idPaciente == "" || nombreCompleto == "" || fechaNacimiento == "" || 
                direccion == "" || correoElectronico == "" || genero == "" || 
                telefonoPersonal == "" || telefonoEmergencia == "" || rfc == "" || seguro == ""
            ){
                alert("Completa todos los campos");
                return;
            }

            const datosPacientes = {
                ID_Paciente: idPaciente,
                Nombre_Completo: nombreCompleto,
                Fecha_nacimiento: fechaNacimiento,
                Direccion: direccion,
                Correo_electronico: correoElectronico,
                Genero: genero,
                Telefono_personal: telefonoPersonal,
                Telefono_emergencia: telefonoEmergencia,
                RFC: rfc,
                Seguro: seguro
            };

            try {
                const respuesta = await fetch(`${backendURL}/api/pacientes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datosPacientes)
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    document.getElementById("id_paciente").value = "";
                    document.getElementById("nombre_completo").value = "";
                    document.getElementById("fecha_nacimiento").value = "";
                    document.getElementById("direccion").value = "";
                    document.getElementById("correo_electronico").value = "";
                    document.getElementById("genero").value = "";
                    document.getElementById("telefono_personal").value = "";
                    document.getElementById("telefono_emergencia").value = "";
                    document.getElementById("rfc").value = "";
                    document.getElementById("seguro").value = "";

                    alert(resultado.mensaje);
                } else {
                    alert("Error al guardar en el servidor: " + resultado.error);
                }

            } catch (error) {
                console.error("Error en la petición:", error);
                alert("No se pudo conectar con el servidor backend. ¿Está encendido?");
            }
        }

        // === FUNCIÓN PARA CONTROLAR EL CAMBIO DE PANTALLA ===
        function cambiarModo(modo) {
            const seccionReg = document.getElementById("seccionRegistrar");
            const seccionBus = document.getElementById("seccionBuscar");
            const btnReg = document.getElementById("btnModoRegistrar");
            const btnBus = document.getElementById("btnModoBuscar");

            if (modo === 'registrar') {
                seccionReg.style.display = "block";
                seccionBus.style.display = "none";
                btnReg.style.backgroundColor = "#067F8F"; btnReg.style.color = "white"; btnReg.style.border = "none";
                btnBus.style.backgroundColor = "#f4f4f4"; btnBus.style.color = "#333"; btnBus.style.border = "1px solid #ddd";
            } else {
                seccionReg.style.display = "none";
                seccionBus.style.display = "block";
                btnReg.style.backgroundColor = "#f4f4f4"; btnReg.style.color = "#333"; btnReg.style.border = "1px solid #ddd";
                btnBus.style.backgroundColor = "#067F8F"; btnBus.style.color = "white"; btnBus.style.border = "none";
            }
        }

        // === FUNCIÓN PARA BUSCAR ===
        async function buscarPacientePorId() {
            let idBuscar = document.getElementById("id_buscar").value;

            if (idBuscar == "") {
                alert("Por favor, escribe un ID para buscar.");
                return;
            }

            try {
                const respuesta = await fetch(`${backendURL}/api/pacientes/${idBuscar}`);
                const tabla = document.getElementById("tablaResultado");
                const cuerpoTabla = document.getElementById("cuerpoResultado");

                if (respuesta.status === 404) {
                    tabla.style.display = "none";
                    alert("No se encontró ningún paciente con ese ID en MongoDB Atlas.");
                    return;
                }

                const paciente = await respuesta.json();

                cuerpoTabla.innerHTML = `
                    <tr><td style="padding: 10px; font-weight:bold; border: 1px solid #ddd; background-color: #f9f9f9;">ID Paciente</td><td style="padding: 10px; border: 1px solid #ddd;">${paciente.ID_Paciente}</td></tr>
                    <tr><td style="padding: 10px; font-weight:bold; border: 1px solid #ddd; background-color: #f9f9f9;">Nombre</td><td style="padding: 10px; border: 1px solid #ddd;">${paciente.Nombre_Completo}</td></tr>
                    <tr><td style="padding: 10px; font-weight:bold; border: 1px solid #ddd; background-color: #f9f9f9;">RFC</td><td style="padding: 10px; border: 1px solid #ddd;">${paciente.RFC}</td></tr>
                    <tr><td style="padding: 10px; font-weight:bold; border: 1px solid #ddd; background-color: #f9f9f9;">Correo</td><td style="padding: 10px; border: 1px solid #ddd;">${paciente.Correo_electronico}</td></tr>
                    <tr><td style="padding: 10px; font-weight:bold; border: 1px solid #ddd; background-color: #f9f9f9;">Seguro Médico</td><td style="padding: 10px; border: 1px solid #ddd;">${paciente.Seguro}</td></tr>
                    <tr><td style="padding: 10px; font-weight:bold; border: 1px solid #ddd; background-color: #f9f9f9;">Teléfono Personal</td><td style="padding: 10px; border: 1px solid #ddd;">${paciente.Telefono_personal}</td></tr>
                `;

                tabla.style.display = "table";

            } catch (error) {
                console.error("Error en la búsqueda:", error);
                alert("Hubo un problema de conexión con el servidor.");
            }
        }
    </script>
</body>
</html>
